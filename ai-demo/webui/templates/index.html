<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIEM AI Agent</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121822;
    --panel-2: #1a2230;
    --border: #232d3d;
    --text: #e6edf3;
    --text-dim: #8b98a9;
    --accent: #5eb4f5;
    --accent-2: #7c6cf0;
    --user-bubble: #1f2b3d;
    --agent-bubble: #151b26;
    --error: #f16d6d;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, rgba(94,180,245,0.08), transparent),
                radial-gradient(1000px 500px at 100% 0%, rgba(124,108,240,0.08), transparent),
                var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .center-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .login-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .login-sub { color: var(--text-dim); font-size: 13px; margin: 0 0 24px 0; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    cursor: pointer;
    border: none;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary {
    width: 100%;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0b0f14;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .error-text { color: var(--error); font-size: 13px; margin-top: 10px; }

  .app-shell { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(18,24,34,0.7);
    backdrop-filter: blur(6px);
  }
  .topbar-title { font-weight: 700; font-size: 15px; }
  .topbar-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .logout-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--accent); }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble.user { background: var(--user-bubble); border: 1px solid var(--border); }
  .bubble.agent { background: var(--agent-bubble); border: 1px solid var(--border); }
  .markdown-body :first-child { margin-top: 0; }
  .markdown-body :last-child { margin-bottom: 0; }
  .markdown-body p { margin: 0 0 10px 0; }
  .markdown-body ul, .markdown-body ol { margin: 0 0 10px 0; padding-left: 22px; }
  .markdown-body li { margin: 2px 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 {
    margin: 14px 0 8px 0; font-size: 1.05em; font-weight: 700; color: var(--text);
  }
  .markdown-body code {
    background: rgba(255,255,255,0.08);
    padding: 2px 5px;
    border-radius: 5px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  .markdown-body pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 10px 0;
  }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body a { color: var(--accent); }
  .markdown-body strong { color: var(--text); }
  .markdown-body table { border-collapse: collapse; margin: 0 0 10px 0; }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border); padding: 4px 8px; font-size: 0.92em;
  }
  .tool-line {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    opacity: 0.85;
    margin: 2px 0;
  }
  .tool-line.error { color: var(--error); }

  .composer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: rgba(18,24,34,0.7);
  }
  .composer input {
    flex: 1;
  }
  .send-btn {
    padding: 12px 20px;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0b0f14;
  }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .typing-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    margin-right: 3px;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app-source">

const { useState, useEffect, useRef, useCallback } = React;

function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!username.trim()) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed");
      onLogin(data.username);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="center-screen">
      <form className="login-card" onSubmit={submit}>
        <p className="login-title">SIEM AI Agent</p>
        <p className="login-sub">Enter a username to start chatting with the Hub Kafka cluster.</p>
        <input
          type="text"
          placeholder="Username"
          value={username}
          onChange={(e) => setUsername(e.target.value)}
          autoFocus
        />
        <button className="btn-primary" type="submit" disabled={loading}>
          {loading ? "Signing in..." : "Enter"}
        </button>
        {error && <p className="error-text">{error}</p>}
      </form>
    </div>
  );
}

function ToolLine({ event }) {
  if (event.type === "tool_call") {
    return <div className="tool-line">→ tool: {event.name} {JSON.stringify(event.input)}</div>;
  }
  if (event.type === "tool_error") {
    return <div className="tool-line error">tool error ({event.name}): {event.error}</div>;
  }
  return null;
}

function renderMarkdown(text) {
  try {
    return { __html: DOMPurify.sanitize(marked.parse(text)) };
  } catch (err) {
    console.error("Markdown render failed:", err);
    return { __html: DOMPurify.sanitize(text.replace(/\n/g, "<br/>")) };
  }
}

function ChatScreen({ me, onLogout }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const chatRef = useRef(null);

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages]);

  const send = useCallback(async () => {
    const text = input.trim();
    if (!text || sending) return;
    setInput("");
    setSending(true);

    const userMsg = { role: "user", text };
    const agentMsg = { role: "agent", text: "", events: [] };
    setMessages((prev) => [...prev, userMsg, agentMsg]);

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Request failed");
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith("data: ")) continue;
          const event = JSON.parse(part.slice(6));
          setMessages((prev) => {
            const next = [...prev];
            const last = next[next.length - 1];
            if (event.type === "text_delta") {
              last.text += event.text;
            } else if (event.type === "tool_call" || event.type === "tool_error") {
              last.events = [...last.events, event];
            }
            next[next.length - 1] = { ...last };
            return next;
          });
        }
      }
    } catch (err) {
      setMessages((prev) => {
        const next = [...prev];
        next[next.length - 1] = { ...next[next.length - 1], text: `[error] ${err.message}` };
        return next;
      });
    } finally {
      setSending(false);
    }
  }, [input, sending]);

  const onKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <div className="app-shell">
      <div className="topbar">
        <div>
          <div className="topbar-title">SIEM AI Agent — {me.username}</div>
          <div className="topbar-meta">{me.model} · {me.cluster}</div>
        </div>
        <button className="logout-btn" onClick={onLogout}>Log out</button>
      </div>

      <div className="chat-area" ref={chatRef}>
        {messages.map((m, i) => (
          <div key={i} className={`msg-row ${m.role}`}>
            <div className={`bubble ${m.role}`}>
              {m.role === "agent" && m.events && m.events.map((ev, j) => <ToolLine key={j} event={ev} />)}
              {m.text ? (
                m.role === "agent" ? (
                  <div className="markdown-body" dangerouslySetInnerHTML={renderMarkdown(m.text)} />
                ) : (
                  m.text
                )
              ) : (
                m.role === "agent" && sending && i === messages.length - 1 ? (
                  <span><span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span></span>
                ) : ""
              )}
            </div>
          </div>
        ))}
      </div>

      <div className="composer">
        <input
          type="text"
          placeholder="Ask about topics or recent events..."
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={onKeyDown}
          disabled={sending}
          autoFocus
        />
        <button className="send-btn" onClick={send} disabled={sending || !input.trim()}>Send</button>
      </div>
    </div>
  );
}

function App() {
  const [me, setMe] = useState(null);
  const [checked, setChecked] = useState(false);

  useEffect(() => {
    fetch("/api/me")
      .then((res) => (res.ok ? res.json() : null))
      .then((data) => setMe(data))
      .finally(() => setChecked(true));
  }, []);

  const handleLogin = (username) => {
    fetch("/api/me").then((res) => res.json()).then(setMe);
  };

  const handleLogout = async () => {
    await fetch("/api/logout", { method: "POST" });
    setMe(null);
  };

  if (!checked) return null;
  return me ? <ChatScreen me={me} onLogout={handleLogout} /> : <LoginScreen onLogin={handleLogin} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Transform the JSX source with an explicit classic runtime (Babel Standalone's
  // default "automatic" runtime injects `import` statements, which fail as a
  // classic script) and execute the result.
  const source = document.getElementById("app-source").textContent;
  const { code } = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx",
  });
  (0, eval)(code);
</script>
</body>
</html>
